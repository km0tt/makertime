<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JokeZone 😂</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <header>
    <h1>😂 JokeZone</h1>
    <p>Jokes generator · Powered by JokeAPI</p>
  </header>

  <main>

  
    <section class="filters">
      <p class="section-title">Категорія</p>
      <div class="chip-row" id="categoryChips">
        <button class="chip active" data-value="Any">Будь-яка</button>
        <button class="chip" data-value="Programming">💻 Програмування</button>
        <button class="chip" data-value="Misc">🎲 Різне</button>
      </div>
    </section>

   
    <div class="card" id="jokeCard">
      <span class="category-badge" id="categoryBadge">—</span>

      <div class="joke-body" id="jokeBody">
        <p class="hint">Натисни кнопку та отримай жарт 😄</p>
      </div>

      <div class="card-footer">
        <span class="joke-id" id="jokeId"></span>
        <button class="copy-btn" id="copyBtn" title="Скопіювати">📋</button>
      </div>
    </div>

  
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Шукаємо найсмішніше…</span>
    </div>

  
    <div class="actions">
      <button class="btn-main" id="fetchBtn">▶ Отримати жарт</button>
      <button class="btn-secondary" id="saveBtn">⭐ Зберегти</button>
    </div>

  
    <section class="saved-section" id="savedSection" style="display:none">
      <h2>Збережені жарти <span id="savedCount">0</span></h2>
      <div class="saved-list" id="savedList"></div>
      <button class="btn-clear" id="clearBtn">🗑 Очистити все</button>
    </section>

  </main>

  <footer>
    Дані з <a href="https://v2.jokeapi.dev" target="_blank">JokeAPI</a>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
